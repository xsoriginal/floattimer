
name: Build Teacher Timer EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build Teacher Timer
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name TeacherTimer --icon TeacherTimer.ico --add-data "TeacherTimer.ico;." --add-data "TeacherTimer-Tray.ico;." teachertimer.py

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: TeacherTimer-Windows
          path: dist/TeacherTimer/
          if-no-files-found: error
